name: Activity01ScopeBoard
options:
  bundleIdPrefix: sg.tertiary.course
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
targets:
  Activity01ScopeBoard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: solution/Sources
      - path: solution/Assets.xcassets
        buildPhase: resources
      - path: solution/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: solution/Info.plist
      properties:
        CFBundleDisplayName: Activity01ScopeBoard
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.tertiary.course.activity01scopeboard
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  Activity01ScopeBoardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [solution/AppTests]
    dependencies:
      - target: Activity01ScopeBoard
schemes:
  Activity01ScopeBoard:
    build:
      targets:
        Activity01ScopeBoard: all
    test:
      targets:
        - name: Activity01ScopeBoardTests
