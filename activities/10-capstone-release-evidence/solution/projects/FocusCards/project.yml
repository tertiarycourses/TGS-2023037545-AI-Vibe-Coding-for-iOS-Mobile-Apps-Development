name: FocusCards
options:
  bundleIdPrefix: sg.tertiary.course
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
targets:
  FocusCards:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SourcesPackage/Sources
      - path: SourcesPackage/Assets.xcassets
        buildPhase: resources
      - path: SourcesPackage/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: SourcesPackage/Info.plist
      properties:
        CFBundleDisplayName: FocusCards
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.tertiary.course.focuscards
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  FocusCardsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SourcesPackage/AppTests]
    dependencies:
      - target: FocusCards

  FocusCardsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SourcesPackage/AppUITests]
    dependencies:
      - target: FocusCards
schemes:
  FocusCards:
    build:
      targets:
        FocusCards: all
    test:
      targets:
        - name: FocusCardsTests
        - name: FocusCardsUITests
