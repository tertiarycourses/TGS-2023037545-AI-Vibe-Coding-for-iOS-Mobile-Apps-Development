name: BudgetBuddy
options:
  bundleIdPrefix: sg.tertiary.course
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
targets:
  BudgetBuddy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SourcesPackage/Sources
      - path: SourcesPackage/Assets.xcassets
        buildPhase: resources
      - path: SourcesPackage/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: SourcesPackage/Info.plist
      properties:
        CFBundleDisplayName: BudgetBuddy
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.tertiary.course.budgetbuddy
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: "SourcesPackage/Sources/Bridge/BudgetBuddy-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/SourcesPackage/Sources/Bridge"
  BudgetBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SourcesPackage/AppTests]
    dependencies:
      - target: BudgetBuddy

  BudgetBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SourcesPackage/AppUITests]
    dependencies:
      - target: BudgetBuddy
schemes:
  BudgetBuddy:
    build:
      targets:
        BudgetBuddy: all
    test:
      targets:
        - name: BudgetBuddyTests
        - name: BudgetBuddyUITests
