name: Activity10ReleaseGate
options:
  bundleIdPrefix: sg.tertiary.course
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
targets:
  Activity10ReleaseGate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: solution/Sources
      - path: solution/Assets.xcassets
        buildPhase: resources
      - path: solution/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: solution/Info.plist
      properties:
        CFBundleDisplayName: Activity10ReleaseGate
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sg.tertiary.course.activity10releasegate
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  Activity10ReleaseGateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [solution/AppTests]
    dependencies:
      - target: Activity10ReleaseGate

  Activity10ReleaseGateUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [solution/AppUITests]
    dependencies:
      - target: Activity10ReleaseGate
schemes:
  Activity10ReleaseGate:
    build:
      targets:
        Activity10ReleaseGate: all
    test:
      targets:
        - name: Activity10ReleaseGateTests
        - name: Activity10ReleaseGateUITests
